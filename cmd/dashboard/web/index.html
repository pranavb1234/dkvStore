<!doctype html><html><head><meta charset="utf-8"><title>dkvStore Dashboard</title><style>body{font:16px system-ui;background:#101827;color:#e5e7eb;margin:0;padding:28px}main{max-width:1050px;margin:auto}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,form,pre{background:#182235;border:1px solid #334155;border-radius:10px;padding:16px}button{padding:8px 12px;border:0;border-radius:6px;background:#38bdf8;color:#082f49;font-weight:700;cursor:pointer}.down{background:#fb7185;color:#500724}.up{background:#4ade80}input,select{padding:9px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:white}pre{white-space:pre-wrap;min-height:70px}</style></head><body><main><h1>dkvStore · 3-node demo</h1><p>Write and read through any entry node. “Simulate down” makes a node unavailable to requests and health probes without Docker-socket access.</p><section id="nodes" class="grid"></section><h2>Key/value</h2><form id="kv"><select id="node"><option>node1</option><option>node2</option><option>node3</option></select> <input id="key" placeholder="key" required> <input id="value" placeholder="value"> <button data-method="PUT">Put</button> <button data-method="GET">Get</button> <button data-method="DELETE">Delete</button></form><h2>Response</h2><pre id="out">Waiting…</pre></main><script>const out=document.querySelector('#out');async function call(u,o={}){let r=await fetch(u,o),t=await r.text();out.textContent=r.status+' '+t;return r}async function refresh(){let r=await fetch('/api/nodes'),a=await r.json();document.querySelector('#nodes').innerHTML=a.map(n=>{let h=n.health?JSON.parse(n.health):null;return `<div class=card><h3>${n.id}</h3><p>${h?'● healthy':'● unavailable'}</p><pre>${h?JSON.stringify(h.peers,null,2):n.error}</pre><button class=down onclick="act('${n.id}','down')">Simulate down</button> <button class=up onclick="act('${n.id}','up')">Bring up</button></div>`}).join('')}async function act(n,a){await call('/api/nodes/'+n+'/'+a,{method:'POST'});setTimeout(refresh,300)}document.querySelectorAll('#kv button').forEach(b=>b.onclick=async e=>{e.preventDefault();let m=b.dataset.method,n=node.value,k=key.value,v=value.value,o={method:m};if(m==='PUT')o.body=JSON.stringify({value:v}),o.headers={'Content-Type':'application/json'};await call('/api/kv?node='+n+'&key='+encodeURIComponent(k),o);refresh()});refresh();setInterval(refresh,2000)</script></body></html>
