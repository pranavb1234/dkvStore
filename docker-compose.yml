services:
  dashboard:
    build: .
    entrypoint: ["/usr/local/bin/dashboard"]
    ports:
      - "8080:8080"
    depends_on:
      - node1
      - node2
      - node3

  node1:
    build: .
    command: ["-config", "/etc/dkv/node1.json"]
    volumes:
      - ./configs/docker/node1.json:/etc/dkv/node1.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 3

  node2:
    build: .
    command: ["-config", "/etc/dkv/node2.json"]
    volumes:
      - ./configs/docker/node2.json:/etc/dkv/node2.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 3

  node3:
    build: .
    command: ["-config", "/etc/dkv/node3.json"]
    volumes:
      - ./configs/docker/node3.json:/etc/dkv/node3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 3
